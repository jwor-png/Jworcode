name: Cuan Daily Update

on:
  schedule:
    # 07:47 UTC daily — adjust if John's timezone needs shifting
    - cron: '47 7 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cuan daily update
        run: python .github/scripts/cuan_daily_update.py

      - name: Commit and push if changed
        run: |
          git config user.name "Cuan Daily Update"
          git config user.email "jwor@ambrion.ai"
          git add cuan/logs/daily-update-log.md cuan/ventures_dossier.md
          if git diff --cached --quiet; then
            echo "No changes to commit — Cuan already current."
          else
            git commit -m "Cuan daily update $(date -u '+%Y-%m-%d')"
            git push
          fi
